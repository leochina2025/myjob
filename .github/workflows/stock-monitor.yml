name: US Stock Monitor Bot

on:
  # 定时触发器（使用UTC时间）
  schedule:
    # 北京时间 23:00 (对应UTC时间 15:00)
    - cron: '0 15 * * *'
    # 北京时间 7:30 (对应UTC时间 23:30，注意是前一天的23:30)
    - cron: '30 23 * * *'
  
  # 允许手动触发
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock monitoring script
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python watchstock2.py
